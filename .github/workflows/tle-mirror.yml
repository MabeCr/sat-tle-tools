# SPDX-License-Identifier: MIT
# A copy of CelesTrak's amateur element sets kept on this site (tle/amateur.txt, tle/mirror.json) for the page to fall back
# on when CelesTrak can't be reached from the browser (lib/source.js). Taken from GitHub's servers every six hours: CelesTrak
# asks for no more than one download of a group every two hours. When CelesTrak fails, AMSAT's list stands in. A failed
# download of both keeps the copy that is there.
name: tle-mirror

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tle-mirror

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download, check and commit when the sets changed
        run: |
          # CelesTrak first, then AMSAT's list of the same satellites. AMSAT sends no cross-origin header, so the page
          # can't read it itself: this job can, and the page says which of the two the copy came from
          ua="sat-tle-tools mirror (https://github.com/MabeCr/sat-tle-tools)"
          got=""
          for src in "CelesTrak|https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle" \
                     "AMSAT|https://www.amsat.org/tle/current/nasabare.txt"; do
            name="${src%%|*}"; url="${src#*|}"
            if ! curl -fsSL --retry 3 --retry-delay 30 --max-time 60 -A "$ua" "$url" -o /tmp/download.txt; then
              echo "::warning::$name could not be reached"
              continue
            fi
            # Only element sets that parse (the page's own rules) are kept: an error page or a cut download is not
            sets=$(node --input-type=module -e '
              import { readFileSync } from "node:fs";
              import { parse } from "./lib/tle.js";
              console.log(parse(readFileSync("/tmp/download.txt", "utf8")).size);
            ')
            if [ "${sets:-0}" -lt 10 ]; then
              echo "::warning::$name answered with ${sets:-0} element sets, not a usable list"
              continue
            fi
            got="$name"
            break
          done
          if [ -z "$got" ]; then
            echo "::warning::no source could be used: the copy stays as it is"
            exit 0
          fi
          mkdir -p tle
          if cmp -s /tmp/download.txt tle/amateur.txt; then
            echo "unchanged"
            exit 0
          fi
          cp /tmp/download.txt tle/amateur.txt
          printf '{"fetched": "%s", "sets": %s, "source": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$sets" "$got" > tle/mirror.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tle
          git commit -m "Mirror: element sets of $(date -u +%Y-%m-%d\ %H:%M) UTC ($sets sets from $got)"
          git push
