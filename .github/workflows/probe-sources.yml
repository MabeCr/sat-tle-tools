# SPDX-License-Identifier: MIT
# A one-off check of candidate element set sources: do they answer, with what, and do they allow the page's origin.
name: probe-sources
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for u in \
            "https://www.amsat.org/tle/current/nasabare.txt" \
            "https://www.amsat.org/amsat/ftp/keps/current/nasabare.txt" \
            "https://celestrak.org/NORAD/elements/gp.php?GROUP=amateur&FORMAT=tle"; do
            echo "=== $u"
            curl -sSL -m 30 -D /tmp/h -o /tmp/b -H "Origin: https://mabecr.github.io" "$u" || echo "curl failed"
            grep -i -E "^HTTP|^content-type|^content-length|^access-control|^last-modified|^location" /tmp/h
            echo "--- first lines:"; head -4 /tmp/b
            echo "--- lines: $(wc -l < /tmp/b)"
          done
